name: web

on:
  push:
    branches: [main]
    paths:
      - 'telos-web/**'
      - '.github/workflows/web.yml'
  pull_request:
    paths:
      - 'telos-web/**'
      - '.github/workflows/web.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: telos-web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: telos-web/package-lock.json

      - name: Install
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
