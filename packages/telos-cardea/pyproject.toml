[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "telos-cardea"
version = "0.1.0"
description = "Telos routine tools (mail, listings, search, browser, memory, ledger) as Cardea installed operations"
readme = "README.md"
# Cardea's API requires >=3.12; the package runs in Cardea's environment.
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12",
    "curl_cffi>=0.7",
    "httpx>=0.27",
    "mistune>=3.0",
    # The vendored OnTheMarket parser validates Next.js state with pydantic models.
    "pydantic>=2.7",
]

[project.optional-dependencies]
# Free web search (DDGS: Bing, Brave, DuckDuckGo, Yahoo).
search = ["ddgs>=7.0"]
# Headless Chromium for browser.* and the listing fetch fallback.
# Confined-worker profile only; run `patchright install chromium` after installing.
browser = ["patchright"]

[project.entry-points."cardea.operations"]
"mail.send" = "telos_cardea.mail:send"
"mail.send.reconcile" = "telos_cardea.mail:reconcile"
"mail.preview" = "telos_cardea.mail:preview"
"listings.rightmove_search" = "telos_cardea.listings:rightmove_search"
"listings.zoopla_search" = "telos_cardea.listings:zoopla_search"
"listings.onthemarket_search" = "telos_cardea.listings:onthemarket_search"
"listings.agency_search" = "telos_cardea.listings:agency_search"
"web.search" = "telos_cardea.web:search"
"browser.open" = "telos_cardea.browser:open_page"
"browser.click" = "telos_cardea.browser:click"
"memory.recall" = "telos_cardea.memory:recall"
"memory.briefing" = "telos_cardea.memory:briefing"
"memory.reconcile_candidates" = "telos_cardea.memory_reconcile:candidates"
"memory.reconcile_apply" = "telos_cardea.memory_reconcile:apply"
"memory.reconcile_apply.reconcile" = "telos_cardea.memory_reconcile:reconcile_apply"
"memory.reconcile_apply_preview" = "telos_cardea.memory_reconcile:apply_preview"
"memory.reconcile_finish" = "telos_cardea.memory_reconcile:finish"
"memory.reconcile_finish.reconcile" = "telos_cardea.memory_reconcile:reconcile_finish"
"memory.reconcile_finish_preview" = "telos_cardea.memory_reconcile:finish_preview"
"telos.routine_context" = "telos_cardea.routine:routine_context"
"ledger.list" = "telos_cardea.ledger:list_"
"ledger.history" = "telos_cardea.ledger:history"
"ledger.record" = "telos_cardea.ledger:record"
"ledger.record.reconcile" = "telos_cardea.ledger:reconcile_record"
"ledger.record_preview" = "telos_cardea.ledger:record_preview"

[dependency-groups]
dev = [
    "jsonpointer==3.1.1",
    "jsonschema==4.26.0",
    "mcp==2.2.0",
    "mypy>=1.10",
    "pydantic>=2.7",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "rfc8785==0.1.4",
    "ruff>=0.6",
    "types-jsonschema>=4.26.0.20260518",
]
# Real Cardea for descriptor validation. Private repository: needs GitHub
# credentials, so CI uses the vendored copy in tests/_cardea_operations.py.
cardea = [
    "cardea-api @ git+https://github.com/pasinit/cardea.git@b15119ba1ea512356a2522e1e682768c2ac35705#subdirectory=apps/api",
]

[tool.uv]
default-groups = ["dev"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/telos_cardea"]

[tool.ruff]
line-length = 150
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["src/telos_cardea/_vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "TID"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"telos".msg = "telos_cardea must not import the Telos app; vendor the pure logic instead"

[tool.ruff.lint.isort]
known-first-party = ["telos_cardea"]
known-local-folder = ["conftest", "_cardea_operations"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
mypy_path = "src:tests"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["telos_cardea._vendor.*"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["cardea.*", "curl_cffi.*", "ddgs.*", "patchright.*", "mistune.*", "jsonpointer", "rfc8785"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["tests"]
